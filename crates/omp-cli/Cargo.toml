[package]
name = "omp-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "omp2"
path = "src/main.rs"

[dependencies]
omp-types = { path = "../omp-types" }
omp-state = { path = "../omp-state" }
omp-control = { path = "../omp-control" }
omp-server = { path = "../omp-server" }
omp-render = { path = "../omp-render" }
omp-runtime = { path = "../omp-runtime" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot = "=0.12.5"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.0"

[[test]]
name = "smoke"
path = "../../tests/smoke/cli_smoke.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Console"] }
