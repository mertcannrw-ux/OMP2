# Global default omp2 configuration
# Set OMP_ENDPOINT and OMP_API_KEY in the host environment before starting omp2.
# Run/resume/serve refresh the model catalog; absent metadata remains unknown.
# In the console: /provider shows models; /provider select <id> changes selection.
# Use /provider refresh after a discovery failure; never put API keys in this file.
ai_temperature 0.7
cl_theme "dark"
cl_showthinking 1
cl_resize_policy "rebuild"
tool_max_output_bytes 1048576
tool_max_runtime_ms 30000
