[workspace]
members = [
  "crates/omp-types", "crates/omp-state", "crates/omp-runtime", "crates/omp-inference",
  "crates/omp-control", "crates/omp-tools", "crates/omp-render", "crates/omp-server",
  "crates/omp-cli", "crates/omp-python"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.20"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
hex = "=0.4.3"
uuid = { version = "=1.26.0", features = ["v4"] }
