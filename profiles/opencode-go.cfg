# OpenCode Go — open coding models on a flat $10/month subscription.
#
# The subscription key stays in the host environment; never put it in a config
# file. Before starting:  set OPENCODE_GO_API_KEY=... (or export it in your shell)
#
#   omp2 --profile opencode-go
#
# Model selection: /provider lists the catalog, /provider select <id> switches.
# Limits: per-model monthly budgets, see https://opencode.ai/docs/go/
ai_provider_name "opencode-go"
ai_provider "openai_compatible"
ai_endpoint "https://opencode.ai/zen/go/v1"
ai_api_key_env "OPENCODE_GO_API_KEY"
ai_model "glm-5.3-flash"
